<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Desktop Background -->
  <rect width="900" height="560" fill="#0f172a"/>

  <!-- Setup Wizard Dialog Box (Authentic Inno Setup / Microsoft Installer) -->
  <g transform="translate(150, 20)" filter="url(#winShadow)">
    <rect width="600" height="470" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1"/>

    <!-- Windows Title Bar -->
    <rect width="600" height="32" rx="8" fill="#ffffff"/>
    <rect y="16" width="600" height="16" fill="#ffffff"/>
    <line x1="0" y1="32" x2="600" y2="32" stroke="#d4d4d4"/>
    <text x="14" y="21" fill="#1f2937" font-size="12" font-weight="600">Setup - Visual Studio Code</text>
    <!-- Windows Close X -->
    <rect x="560" y="0" width="40" height="32" rx="0" fill="#e81123"/>
    <path d="M575 11L585 21M585 11L575 21" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Wizard Header Area -->
    <rect y="32" width="600" height="65" fill="#ffffff"/>
    <line x1="0" y1="97" x2="600" y2="97" stroke="#d4d4d4"/>
    <text x="24" y="58" fill="#000000" font-size="13" font-weight="bold">License Agreement</text>
    <text x="36" y="78" fill="#4b5563" font-size="11">Please read the following important information before continuing.</text>
    <!-- Small VS Code Logo in header -->
    <g transform="translate(540, 42)">
      <rect width="36" height="36" rx="4" fill="#007acc"/>
      <path d="M12 24L18 18L12 12" stroke="#ffffff" stroke-width="2" fill="none"/>
    </g>

    <!-- Content instructions -->
    <text x="24" y="118" fill="#1f2937" font-size="11">Please read the following License Agreement. You must accept the terms of this agreement before continuing with the installation.</text>

    <!-- License Terms Scroll Box -->
    <g transform="translate(24, 130)">
      <rect width="552" height="170" fill="#ffffff" stroke="#7a7a7a" stroke-width="1"/>
      <!-- Text inside terms box -->
      <text x="14" y="24" fill="#111827" font-size="11" font-weight="bold">MICROSOFT SOFTWARE LICENSE TERMS</text>
      <text x="14" y="42" fill="#111827" font-size="11" font-weight="bold">MICROSOFT VISUAL STUDIO CODE</text>
      <text x="14" y="65" fill="#374151" font-size="11">These license terms are an agreement between Microsoft Corporation (or based on where you</text>
      <text x="14" y="82" fill="#374151" font-size="11">live, one of its affiliates) and you. Please read them. They apply to the software named above,</text>
      <text x="14" y="99" fill="#374151" font-size="11">which includes the media on which you received it, if any. The terms also apply to any Microsoft</text>
      <text x="14" y="116" fill="#374151" font-size="11">updates, supplements, Internet-based services, and support services for this software...</text>
      <text x="14" y="140" fill="#2563eb" font-size="11" text-decoration="underline">https://code.visualstudio.com/License</text>
      <!-- Scrollbar track on right -->
      <rect x="536" y="0" width="16" height="170" fill="#f1f1f1"/>
      <rect x="538" y="4" width="12" height="50" rx="2" fill="#c1c1c1"/>
    </g>

    <!-- Radio Button Options (Crucial Step 4) -->
    <g transform="translate(24, 320)">
      <!-- Selected Radio 1 (I accept) -->
      <circle cx="8" cy="8" r="7" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
      <circle cx="8" cy="8" r="3.5" fill="#0078d4"/>
      <text x="24" y="12" fill="#000000" font-size="12" font-weight="bold">I accept the agreement</text>
      <!-- Green check badge -->
      <rect x="180" y="-1" width="85" height="20" rx="4" fill="#04AA6D"/>
      <text x="188" y="13" fill="#ffffff" font-size="10" font-weight="bold">✓ SELECT THIS</text>
    </g>

    <g transform="translate(24, 350)">
      <!-- Unselected Radio 2 (I do not accept) -->
      <circle cx="8" cy="8" r="7" fill="#ffffff" stroke="#767676" stroke-width="1.5"/>
      <text x="24" y="12" fill="#4b5563" font-size="12">I do not accept the agreement</text>
    </g>

    <!-- Bottom Separator Line -->
    <line x1="0" y1="410" x2="600" y2="410" stroke="#d4d4d4"/>

    <!-- Bottom Buttons -->
    <g transform="translate(24, 425)">
      <!-- Back Button (Disabled) -->
      <rect x="270" y="0" width="80" height="26" rx="3" fill="#f4f4f4" stroke="#d1d5db"/>
      <text x="310" y="17" fill="#9ca3af" font-size="11" text-anchor="middle">&lt; Back</text>

      <!-- Next Button (Active & Highlighted in Blue) -->
      <rect x="360" y="0" width="85" height="26" rx="3" fill="#0078d4" stroke="#005a9e" stroke-width="1.5"/>
      <text x="402" y="17" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Next &gt;</text>

      <!-- Cancel Button -->
      <rect x="460" y="0" width="80" height="26" rx="3" fill="#ffffff" stroke="#ababab"/>
      <text x="500" y="17" fill="#1f2937" font-size="11" text-anchor="middle">Cancel</text>
    </g>
  </g>

  <!-- Step Footer Banner -->
  <g transform="translate(40, 505)">
    <rect width="820" height="38" rx="6" fill="#04AA6D"/>
    <text x="20" y="24" fill="#ffffff" font-size="13" font-weight="bold">STEP 4: Select "I accept the agreement" radio button and click "Next &gt;"</text>
  </g>
</svg>
